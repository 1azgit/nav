services:
  omninav-editor:
    build:
      context: ..
      dockerfile: editor/Dockerfile
    container_name: omninav-editor
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EDITOR_BIND: 0.0.0.0
      EDITOR_PORT: 8080
      REMOTE_HOST: ${REMOTE_HOST}
      REMOTE_PORT: ${REMOTE_PORT:-22}
      REMOTE_USER: ${REMOTE_USER}
      REMOTE_KEY_PATH: /run/secrets/remote_key
      REMOTE_KNOWN_HOSTS: /run/secrets/known_hosts
      REMOTE_CONFIG_PATH: ${REMOTE_CONFIG_PATH}
    volumes:
      - ..:/app/nav
      - ${REMOTE_KEY_PATH_HOST}:/run/secrets/remote_key:ro
      - ${REMOTE_KNOWN_HOSTS_HOST}:/run/secrets/known_hosts:ro
